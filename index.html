<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-atlas-c6.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ATLAS_C6 — Dashboard de analítica de datos del proyecto ATLAS_C6, Comuna 6 (Doce de Octubre), Medellín. Presentado a la convocatoria Territorio INN 2026." />
    <title>ATLAS_C6 · Dashboard de analítica territorial · Comuna 6, Medellín</title>
    <!--
      Se fija el tema ANTES de montar React para evitar el parpadeo blanco
      al recargar en modo oscuro. Debe leer la misma clave que src/hooks/useTema.ts.
    -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('atlas-c6-tema');
          if (g !== 'claro' && g !== 'oscuro') {
            g = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.theme = g === 'oscuro' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
